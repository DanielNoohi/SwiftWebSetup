name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Static analysis: shellcheck on the supported Ubuntu matrix ─────
  shellcheck:
    name: shellcheck (${{ matrix.container }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [ubuntu:20.04, ubuntu:22.04, ubuntu:24.04]
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - name: Install bash + pinned shellcheck
        run: |
          apt-get update
          apt-get install -y bash curl xz-utils ca-certificates
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            | tar -xJ
          install -m 0755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: bash -n (syntax)
        run: |
          for f in install.sh host-install.sh web-install.sh docker-way.sh lib/common.sh; do bash -n "$f"; done
      - name: shellcheck (warnings treated as failures)
        run: |
          for f in install.sh host-install.sh web-install.sh docker-way.sh lib/common.sh; do
            shellcheck -x -S warning "$f"
          done

  # ── Formatting: shfmt diff check ─────────────────────────────────────
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt
      - name: Check formatting
        run: |
          shfmt -d install.sh host-install.sh web-install.sh docker-way.sh lib/common.sh
          echo "shfmt check done (empty diff above = compliant)"

  # ── Unit tests (bats) ────────────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run bats tests
        run: bats --tap tests

  # ── E2E: native host install (real WordPress on the runner, verified) ─
  e2e-host:
    runs-on: ubuntu-latest
    needs: [shellcheck, format]
    env:
      SWIFTWEB_TITLE: "CI WordPress Site"
      SWIFTWEB_ADMIN: "ciadmin"
      SWIFTWEB_EMAIL: "ci@example.com"
    steps:
      - uses: actions/checkout@v5
      - name: Run host-install.sh (unattended)
        run: |
          set +e
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_OS,RUNNER_NAME \
            env \
            CI=true \
            GITHUB_ACTIONS=true \
            DEBIAN_FRONTEND=noninteractive \
            NEEDRESTART_MODE=a \
            SITE_TITLE="$SWIFTWEB_TITLE" \
            ADMIN_USER="$SWIFTWEB_ADMIN" \
            ADMIN_EMAIL="$SWIFTWEB_EMAIL" \
            bash host-install.sh --unattended
          ec=$?
          echo "host-install exit code: $ec"
          if sudo test -f /var/log/swiftwebsetup-web-install.log; then
            echo "----- installer log (tail) -----"
            sudo tail -n 160 /var/log/swiftwebsetup-web-install.log
            # Surface last errors as Actions annotations (visible without log download auth)
            sudo grep -E '\[ERROR\]|Command failed' /var/log/swiftwebsetup-web-install.log \
              | tail -n 8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          else
            echo "no log file"
            echo "::error::host-install failed and no installer log was written"
          fi
          exit $ec
        timeout-minutes: 30
      - name: Verify a real WordPress front page (not Apache test page) + creds 0600
        run: |
          body=$(curl -fsSL http://127.0.0.1/ || true)
          echo "$body" | grep -qE 'wp-content|wp-includes|wp-json' \
            && echo "OK: WordPress homepage served" \
            || { echo "FAIL: non-WordPress page"; echo "$body" | head -c 800; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/wp-login.php)
          [ "$code" = "200" ] && echo "OK: wp-login.php 200" || { echo "FAIL: wp-login.php -> $code"; exit 1; }
          sudo test -f /root/swiftwebsetup-credentials.txt || { echo "missing creds file"; exit 1; }
          perms=$(sudo stat -c '%a' /root/swiftwebsetup-credentials.txt)
          [ "$perms" = "600" ] && echo "OK: creds 0600" || { echo "FAIL: creds perms $perms"; exit 1; }

  # ── E2E: Docker compose path (wpcli-driven, verified) ─────────────────
  e2e-docker:
    runs-on: ubuntu-latest
    needs: [shellcheck, format]
    env:
      SWIFTWEB_TITLE: "CI Docker WordPress"
      SWIFTWEB_ADMIN: "ciadmin"
      SWIFTWEB_EMAIL: "ci@example.com"
    steps:
      - uses: actions/checkout@v5
      - name: Run docker-way.sh (unattended, non-privileged port 8080)
        run: |
          set +e
          sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_OS,RUNNER_NAME \
            env \
            CI=true \
            GITHUB_ACTIONS=true \
            DEBIAN_FRONTEND=noninteractive \
            NEEDRESTART_MODE=a \
            SITE_TITLE="$SWIFTWEB_TITLE" \
            ADMIN_USER="$SWIFTWEB_ADMIN" \
            ADMIN_EMAIL="$SWIFTWEB_EMAIL" \
            bash docker-way.sh --unattended --port 8080
          ec=$?
          echo "docker-way exit code: $ec"
          if sudo test -f /var/log/swiftwebsetup-docker-way.log; then
            echo "----- installer log (tail) -----"
            sudo tail -n 160 /var/log/swiftwebsetup-docker-way.log
            sudo grep -E '\[ERROR\]|Command failed' /var/log/swiftwebsetup-docker-way.log \
              | tail -n 8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          else
            echo "no log file"
            echo "::error::docker-way failed and no installer log was written"
          fi
          docker compose -f /opt/swiftweb/docker-compose.yml ps || true
          docker compose -f /opt/swiftweb/docker-compose.yml logs --tail=80 || true
          exit $ec
        timeout-minutes: 35
      - name: Prove WordPress site via Docker (not nginx welcome page)
        run: |
          body=$(curl -fsSL http://127.0.0.1:8080/ || true)
          echo "$body" | grep -qE 'wp-content|wp-includes|wp-json' \
            && echo "OK: WordPress served by Docker" \
            || { echo "FAIL: non-WordPress page from Docker"; echo "$body" | head -c 800; exit 1; }
      - name: Show container status
        run: docker compose -f /opt/swiftweb/docker-compose.yml ps
